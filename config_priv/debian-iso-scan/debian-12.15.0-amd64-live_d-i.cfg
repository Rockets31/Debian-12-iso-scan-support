# Debian GNU/Linux 12 system (codename “bookworm”)
# https://www.debian.org


iso_pattern="debian-live-12.15.0-amd64-*.iso"

for isofile in ($dev,*)$iso_dir/$iso_pattern; do
	if [ -e "$isofile" ]; then
		regexp --set=isoname "$iso_dir/(.*)" "$isofile"

		submenu "$isoname [config_priv] ->" "$isofile" "$iso_dir/$isoname" {
			iso_path="$3"
			LOOPBACK "$2"
			isocfg=""
			bootoptions=""
			linux_path="(loop)/"
			initrd_path="(loop)/"

# Live boot
menuentry "Live system (amd64)" --hotkey=l {
	linux	(loop)/live/vmlinuz-6.1.0-50-amd64 boot=live components quiet splash findiso=${iso_path}
	initrd	(loop)/live/initrd.img-6.1.0-50-amd64
}
menuentry "Live system (amd64 fail-safe mode)" {
	linux	(loop)/live/vmlinuz-6.1.0-50-amd64 boot=live components memtest noapic noapm nodma nomce nosmp nosplash vga=788 findiso=${iso_path}
	initrd	(loop)/live/initrd.img-6.1.0-50-amd64
}
# Installer (if any)
if true; then
menuentry 'Start installer' --hotkey=i {
	linux	(loop)/install/gtk/vmlinuz vga=788  --- quiet
	initrd	(loop)/install/gtk/initrd.gz /iso-scan-12.15.0.gz
}
menuentry 'Start installer with speech synthesis' --hotkey=s {
	linux	(loop)/install/gtk/vmlinuz speakup.synth=soft vga=788  --- quiet
	initrd	(loop)/install/gtk/initrd.gz /iso-scan-12.15.0.gz
}
submenu 'Advanced install options ...' --hotkey=a {
submenu 'Graphical installer ...' --hotkey=g {
	menuentry 'Install' --hotkey=i {
		linux	(loop)/install/gtk/vmlinuz vga=788  --- quiet
		initrd	(loop)/install/gtk/initrd.gz /iso-scan-12.15.0.gz
	}
	menuentry 'Expert install' --hotkey=x {
		linux	(loop)/install/gtk/vmlinuz priority=low vga=788
		initrd	(loop)/install/gtk/initrd.gz /iso-scan-12.15.0.gz
	}
	menuentry 'Automated install' --hotkey=a {
		linux	(loop)/install/gtk/vmlinuz auto=true priority=critical vga=788  --- quiet
		initrd	(loop)/install/gtk/initrd.gz /iso-scan-12.15.0.gz
	}
	menuentry 'Rescue mode' --hotkey=r {
		linux	(loop)/install/gtk/vmlinuz rescue/enable=true vga=788  --- quiet
		initrd	(loop)/install/gtk/initrd.gz /iso-scan-12.15.0.gz
	}
}
submenu 'Text installer ...' --hotkey=t {
	menuentry 'Install' --hotkey=i {
		linux	(loop)/install/vmlinuz vga=788  --- quiet
		initrd	(loop)/install/initrd.gz /iso-scan-12.15.0.gz
	}
	menuentry 'Expert install' --hotkey=x {
		linux	(loop)/install/vmlinuz priority=low vga=788
		initrd	(loop)/install/initrd.gz /iso-scan-12.15.0.gz
	}
	menuentry 'Automated install' --hotkey=a {
		linux	(loop)/install/vmlinuz auto=true priority=critical vga=788  --- quiet
		initrd	(loop)/install/initrd.gz /iso-scan-12.15.0.gz
	}
	menuentry 'Rescue mode' --hotkey=r {
		linux	(loop)/install/vmlinuz rescue/enable=true vga=788  --- quiet
		initrd	(loop)/install/initrd.gz /iso-scan-12.15.0.gz
	}
}
submenu 'Graphical installer with dark theme ...' --hotkey=d {
	menuentry 'Install' --hotkey=i {
		linux	(loop)/install/gtk/vmlinuz vga=788 theme=dark  --- quiet
		initrd	(loop)/install/gtk/initrd.gz /iso-scan-12.15.0.gz
	}
	menuentry 'Expert install' --hotkey=x {
		linux	(loop)/install/gtk/vmlinuz priority=low vga=788 theme=dark
		initrd	(loop)/install/gtk/initrd.gz /iso-scan-12.15.0.gz
	}
	menuentry 'Automated install' --hotkey=a {
		linux	(loop)/install/gtk/vmlinuz auto=true priority=critical vga=788 theme=dark  --- quiet
		initrd	(loop)/install/gtk/initrd.gz /iso-scan-12.15.0.gz
	}
	menuentry 'Rescue mode' --hotkey=r {
		linux	(loop)/install/gtk/vmlinuz rescue/enable=true vga=788 theme=dark  --- quiet
		initrd	(loop)/install/gtk/initrd.gz /iso-scan-12.15.0.gz
	}
}
submenu 'Text installer with dark theme ...' --hotkey=k {
	menuentry 'Install' --hotkey=i {
		linux	(loop)/install/vmlinuz vga=788 theme=dark  --- quiet
		initrd	(loop)/install/initrd.gz /iso-scan-12.15.0.gz
	}
	menuentry 'Expert install' --hotkey=x {
		linux	(loop)/install/vmlinuz priority=low vga=788 theme=dark
		initrd	(loop)/install/initrd.gz /iso-scan-12.15.0.gz
	}
	menuentry 'Automated install' --hotkey=a {
		linux	(loop)/install/vmlinuz auto=true priority=critical vga=788 theme=dark  --- quiet
		initrd	(loop)/install/initrd.gz /iso-scan-12.15.0.gz
	}

	menuentry 'Rescue mode' --hotkey=r {
		linux	(loop)/install/vmlinuz rescue/enable=true vga=788 theme=dark  --- quiet
		initrd	(loop)/install/initrd.gz /iso-scan-12.15.0.gz
	}
}
submenu 'Installer with speech synthesis ...' --hotkey=s {
	menuentry 'Install' --hotkey=i {
		linux	(loop)/install/gtk/vmlinuz speakup.synth=soft vga=788  --- quiet
		initrd	(loop)/install/gtk/initrd.gz /iso-scan-12.15.0.gz
	}
	menuentry 'Expert install' --hotkey=x {
		linux	(loop)/install/gtk/vmlinuz speakup.synth=soft priority=low vga=788
		initrd	(loop)/install/gtk/initrd.gz /iso-scan-12.15.0.gz
	}
	menuentry 'Automated install' --hotkey=a {
		linux	(loop)/install/gtk/vmlinuz speakup.synth=soft auto=true priority=critical vga=788  --- quiet
		initrd	(loop)/install/gtk/initrd.gz /iso-scan-12.15.0.gz
	}
	menuentry 'Rescue mode' --hotkey=r {
		linux	(loop)/install/gtk/vmlinuz speakup.synth=soft rescue/enable=true vga=788  --- quiet
		initrd	(loop)/install/gtk/initrd.gz /iso-scan-12.15.0.gz
	}
}
}
fi
submenu 'Utilities...' --hotkey=u {
	# Memtest (if any)
	if false; then
		source (loop)/boot/grub/memtest.cfg
	fi
	# Firmware setup (UEFI)
	if [ "${grub_platform}" = "efi" ]; then
		menuentry "UEFI Firmware Settings" --hotkey=f {
			fwsetup
		}
	fi
	# Verify the checksums
	if true; then
		menuentry "Verify integrity of the boot medium" --hotkey=v {
			linux	(loop)/live/vmlinuz-6.1.0-50-amd64 boot=live components   findiso=${iso_path} verify-checksums
			initrd	(loop)/live/initrd.img-6.1.0-50-amd64
		}
	fi
}
}
fi
done
